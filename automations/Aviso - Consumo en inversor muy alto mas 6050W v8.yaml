-id: consumo_inversor_v8
alias: "Aviso - Consumo en inversor muy alto (>6050W) v8"

description: |-
  Protección de potencia del inversor en dos fases.

  FASE 1 · EMERGENCIA (solo si el disparo supera 7000 W)
  Corta de golpe, sin esperas ni recomprobaciones, todas las cargas
  marcadas con "emergencia: true" en la lista "cargas".

  FASE 2 · ESCALONADO
  Recorre por orden las cargas que no se hayan cortado en la fase 1.
  Antes de cada corte comprueba si la potencia sigue por encima de
  5700 W; tras cada corte espera como máximo 2 s a que el inversor
  refleje la bajada.

  Para cambiar qué se corta en emergencia, el orden o los umbrales,
  basta con editar la variable "cargas".

mode: single
max_exceeded: silent

triggers:
  - trigger: numeric_state
    entity_id: sensor.inversor_power
    above: 6050
    id: cruce

  - trigger: numeric_state
    entity_id: sensor.inversor_power
    above: 6050
    for:
      seconds: 20
    id: persistente

conditions: []

actions:
  # ============================================================
  # CONFIGURACIÓN
  # ============================================================
  - variables:
      umbral_disparo_w: 6050
      umbral_seguro_w: 5700
      umbral_emergencia_w: 7000

      # Lista de cargas en orden de prioridad (fase 2).
      # emergencia: true  → se corta de golpe en la fase 1 si el disparo supera 7000 W.
      # emergencia: false → solo se corta en la fase 2, de forma escalonada.
      # espera: segundos máximos de espera tras el corte en la fase 2.
      cargas:
        - clave: apoyo
          nombre: "🔥 Apoyo eléctrico ACS → OFF"
          tipo: switch
          sensor: sensor.m_aerotermia_apoyo_electrico_potencia
          entidad: switch.m_aerotermia_apoyo_electrico
          umbral: 300
          espera: 2
          flag_ems: true
          emergencia: true

        - clave: lavadora
          nombre: "👕 Lavadora → OFF"
          tipo: switch
          sensor: sensor.lavadora_consumo_actual
          entidad: switch.lavadora
          umbral: 400
          espera: 2
          emergencia: true

        - clave: dhw
          nombre: "♨️ DHW → Eco"
          tipo: dhw
          sensor: sensor.baxi_total_potencia
          entidad: water_heater.instalaciones_dhw
          umbral: 1200
          espera: 2
          flag_ems: true
          emergencia: false

        - clave: lavavajillas
          nombre: "🍽️ Lavavajillas → OFF"
          tipo: switch
          sensor: sensor.lavavajillas_consumo_actual
          entidad: switch.lavavajillas
          umbral: 700
          espera: 2
          emergencia: true

        - clave: coche
          nombre: "🚗 Carga del vehículo → STOP"
          tipo: coche
          sensor: sensor.m_ext_coche_coche_consumo
          umbral: 2000
          espera: 15
          emergencia: true

  # ============================================================
  # ESTADO INICIAL
  # ============================================================
  - variables:
      potencia_inicial: >-
        {{ trigger.to_state.state | float(0) }}

      emergencia: >-
        {{ potencia_inicial > umbral_emergencia_w }}

      evento: >-
        {{ now().strftime('%Y%m%d_%H%M%S') }}

      nombre_sensor: >-
        {{
          state_attr('sensor.inversor_power', 'friendly_name')
          | default('Potencia inversor', true)
        }}

      unidad_sensor: >-
        {{
          state_attr('sensor.inversor_power', 'unit_of_measurement')
          | default('W', true)
        }}

      coche_charge_api_inicial: >-
        {{
          iif(
            is_state('binary_sensor.ioniq_ev_battery_charge', 'on'),
            'Cargando',
            'No cargando'
          )
        }}

      acciones: []
      cortados: []
      liberado_emergencia: 0

  # ============================================================
  # FASE 1 · EMERGENCIA: CORTE DIRECTO, SIN ESPERAS
  # Solo se ejecuta si potencia_inicial > umbral_emergencia_w.
  # Si no es emergencia, la lista queda vacía y no hace nada.
  # ============================================================
  - repeat:
      for_each: >-
        {{ cargas | selectattr('emergencia') | list if emergencia else [] }}

      sequence:
        - variables:
            consumo_antes: >-
              {{ states(repeat.item.sensor) | float(0) }}

            carga_activa: >-
              {{
                is_state(repeat.item.entidad, 'on')
                if repeat.item.tipo == 'switch'
                else (
                  state_attr(repeat.item.entidad, 'operation_mode') != 'Eco'
                  if repeat.item.tipo == 'dhw'
                  else true
                )
              }}

        # Sin comprobar la potencia del inversor: se corta directamente.
        - if: "{{ consumo_antes > repeat.item.umbral and carga_activa }}"
          then:
            - choose:
                - conditions: "{{ repeat.item.tipo == 'switch' }}"
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ repeat.item.entidad }}"
                      continue_on_error: true

                - conditions: "{{ repeat.item.tipo == 'dhw' }}"
                  sequence:
                    - action: water_heater.set_operation_mode
                      target:
                        entity_id: "{{ repeat.item.entidad }}"
                      data:
                        operation_mode: Eco
                      continue_on_error: true

                - conditions: "{{ repeat.item.tipo == 'coche' }}"
                  sequence:
                    - action: kia_uvo.stop_charge
                      continue_on_error: true

            - if: "{{ repeat.item.flag_ems | default(false) }}"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.ems_acs_forzado_off_y_o_eco_emergencia
                  continue_on_error: true

            - if: "{{ acciones | count == 0 }}"
              then:
                - action: siren.turn_on
                  target:
                    entity_id: siren.yelmo
                  data:
                    volume_level: 0.25
                    duration: 7
                    tone: "Alarm 5"
                  continue_on_error: true

            - variables:
                acciones: >-
                  {{
                    acciones
                    + [repeat.item.nombre ~ ' (' ~ (consumo_antes | round(0) | int) ~ ' W) · emergencia']
                  }}
                cortados: "{{ cortados + [repeat.item.clave] }}"
                liberado_emergencia: "{{ liberado_emergencia + consumo_antes }}"

            - action: persistent_notification.create
              data:
                notification_id: "consumo_alto_{{ evento }}_paso_{{ acciones | count }}"
                title: "🚨 Protección V8 · Paso {{ acciones | count }} · EMERGENCIA"
                message: |-
                  🕒 {{ now().strftime('%H:%M:%S') }}

                  ⚡ Potencia de disparo: {{ potencia_inicial | round(0) | int }} W
                  (por encima de {{ umbral_emergencia_w }} W → corte directo)

                  🛡️ Acción ejecutada:
                  {{ repeat.item.nombre }}

                  📉 Consumo de la carga: {{ consumo_antes | round(0) | int }} W

  # Una única espera tras la fase 1, para que la fase 2 decida con
  # una lectura del inversor que ya refleje los cortes de emergencia.
  - if: "{{ cortados | count > 0 }}"
    then:
      - wait_template: >-
          {% set p = states('sensor.inversor_power') | float(0) %}
          {{
            p <= umbral_seguro_w
            or p < potencia_inicial - liberado_emergencia * 0.5
          }}
        timeout:
          seconds: 3
        continue_on_timeout: true

  # ============================================================
  # FASE 2 · ESCALONADO: UNA CARGA CADA VEZ, CON RECOMPROBACIÓN
  # Recorre las cargas que no se cortaron en la fase 1.
  # ============================================================
  - repeat:
      for_each: >-
        {{ cargas | rejectattr('clave', 'in', cortados) | list }}

      sequence:
        - variables:
            potencia_antes: >-
              {{ states('sensor.inversor_power') | float(0) }}

            consumo_antes: >-
              {{ states(repeat.item.sensor) | float(0) }}

            carga_activa: >-
              {{
                is_state(repeat.item.entidad, 'on')
                if repeat.item.tipo == 'switch'
                else (
                  state_attr(repeat.item.entidad, 'operation_mode') != 'Eco'
                  if repeat.item.tipo == 'dhw'
                  else true
                )
              }}

        # Aquí sí se comprueba si todavía hace falta cortar.
        - if:
            - condition: template
              value_template: >-
                {{
                  potencia_antes > umbral_seguro_w
                  and consumo_antes > repeat.item.umbral
                  and carga_activa
                }}

          then:
            - choose:
                - conditions: "{{ repeat.item.tipo == 'switch' }}"
                  sequence:
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ repeat.item.entidad }}"
                      continue_on_error: true

                - conditions: "{{ repeat.item.tipo == 'dhw' }}"
                  sequence:
                    - action: water_heater.set_operation_mode
                      target:
                        entity_id: "{{ repeat.item.entidad }}"
                      data:
                        operation_mode: Eco
                      continue_on_error: true

                - conditions: "{{ repeat.item.tipo == 'coche' }}"
                  sequence:
                    - action: kia_uvo.stop_charge
                      continue_on_error: true

            - if: "{{ repeat.item.flag_ems | default(false) }}"
              then:
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.ems_acs_forzado_off_y_o_eco_emergencia
                  continue_on_error: true

            - if: "{{ acciones | count == 0 }}"
              then:
                - action: siren.turn_on
                  target:
                    entity_id: siren.yelmo
                  data:
                    volume_level: 0.25
                    duration: 7
                    tone: "Alarm 5"
                  continue_on_error: true

            # Espera hasta que el inversor refleje el corte
            # (potencia en margen seguro o caída de al menos la mitad
            # del consumo cortado), con un máximo de repeat.item.espera s.
            - wait_template: >-
                {% set p = states('sensor.inversor_power') | float(0) %}
                {{
                  p <= umbral_seguro_w
                  or p < potencia_antes - consumo_antes * 0.5
                }}
              timeout:
                seconds: "{{ repeat.item.espera }}"
              continue_on_timeout: true

            - variables:
                acciones: >-
                  {{
                    acciones
                    + [repeat.item.nombre ~ ' (' ~ (consumo_antes | round(0) | int) ~ ' W)']
                  }}
                cortados: "{{ cortados + [repeat.item.clave] }}"

            - action: persistent_notification.create
              data:
                notification_id: "consumo_alto_{{ evento }}_paso_{{ acciones | count }}"
                title: "⚠️ Protección V8 · Paso {{ acciones | count }} · escalonado"
                message: |-
                  🕒 {{ now().strftime('%H:%M:%S') }}

                  ⚡ Potencia inicial: {{ potencia_inicial | round(0) | int }} W
                  ⚡ Antes de actuar: {{ potencia_antes | round(0) | int }} W
                  ⚡ Después: {{ states('sensor.inversor_power') | float(0) | round(0) | int }} W

                  🛡️ Acción ejecutada:
                  {{ repeat.item.nombre }}

                  📉 Consumo de la carga: {{ consumo_antes | round(0) | int }} W

  # ============================================================
  # CIERRE
  # ============================================================
  # Sirena si no había nada que cortar
  - if: "{{ acciones | count == 0 }}"
    then:
      - action: siren.turn_on
        target:
          entity_id: siren.yelmo
        data:
          volume_level: 0.25
          duration: 7
          tone: "Alarm 5"
        continue_on_error: true

  # Refresco del coche solo si se ha parado su carga
  - if: "{{ 'coche' in cortados }}"
    then:
      - action: button.press
        target:
          entity_id: button.ioniq_force_refresh
        continue_on_error: true

  - variables:
      potencia_final: >-
        {{ states('sensor.inversor_power') | float(0) }}

      reduccion_observada: >-
        {{ [potencia_inicial - potencia_final, 0] | max }}

      nivel_final: >-
        {% if potencia_final <= umbral_seguro_w %}seguro
        {%- elif potencia_final <= umbral_disparo_w %}cerca
        {%- else %}alto{% endif %}

      estado_final: >-
        {{
          {
            'seguro': '✅ Potencia situada en margen seguro.',
            'cerca': '🟡 Potencia reducida, pero todavía próxima al límite.',
            'alto': '🔴 El consumo continúa por encima del umbral de emergencia.'
          }[nivel_final]
        }}

      estado_final_voz: >-
        {{
          {
            'seguro': 'Potencia situada en margen seguro.',
            'cerca': 'Potencia reducida, pero todavía próxima al límite.',
            'alto': 'El consumo continúa por encima del umbral de emergencia.'
          }[nivel_final]
        }}

      acciones_texto: >-
        {{
          acciones | join('\n')
          if acciones | count > 0
          else 'Sin cargas controlables disponibles.'
        }}

      coche_charge_api_final: >-
        {{
          iif(
            is_state('binary_sensor.ioniq_ev_battery_charge', 'on'),
            'Cargando',
            'No cargando'
          )
        }}

  - action: persistent_notification.create
    data:
      notification_id: "consumo_alto_{{ evento }}_resumen"
      title: "⚠️ Consumo muy alto detectado V8 · Resumen"
      message: |-
        🕒 {{ now().strftime('%H:%M:%S') }} · Modo {{ 'EMERGENCIA + escalonado' if emergencia else 'escalonado' }}{{ ' · re-disparo' if trigger.id == 'persistente' else '' }}

        ⚡ {{ nombre_sensor }}
        Inicial: {{ potencia_inicial | round(0) | int }} {{ unidad_sensor }}
        Final: {{ potencia_final | round(0) | int }} {{ unidad_sensor }}
        📉 Reducción observada: {{ reduccion_observada | round(0) | int }} W

        {{ estado_final }}

        ------------------------------------------------
        🛡️ Acciones ejecutadas:
        {{ acciones_texto }}
        ------------------------------------------------

        🚗 Coche: {{ states('sensor.m_ext_coche_coche_consumo') | float(0) | round(0) | int }} W
        API inicial: {{ coche_charge_api_inicial }} · API final: {{ coche_charge_api_final }}
        🔥 Apoyo eléctrico ACS: {{ states('sensor.m_aerotermia_apoyo_electrico_potencia') | float(0) | round(0) | int }} W
        👕 Lavadora: {{ states('sensor.lavadora_consumo_actual') | float(0) | round(0) | int }} W
        🍽️ Lavavajillas: {{ states('sensor.lavavajillas_consumo_actual') | float(0) | round(0) | int }} W

        ------------------------------------------------

        🍳 Vitro: {{ states('sensor.m_var_em2_power') | float(0) | round(0) | int }} W
        🍕 Horno: {{ states('sensor.m_var_em0_power') | float(0) | round(0) | int }} W
        ♨️❄️ Aerotermia: {{ states('sensor.baxi_total_potencia') | float(0) | round(0) | int }} W
        🍴 Auxiliar cocina: {{ states('sensor.m_aux_phase_a_active_power') | float(0) | round(0) | int }} W
        🛋️ Auxiliar habitaciones: {{ states('sensor.m_aux_phase_b_active_power') | float(0) | round(0) | int }} W
        💻 Auxiliar IT: {{ states('sensor.m_aux_phase_c_active_power') | float(0) | round(0) | int }} W
        💡 Luces: {{ states('sensor.m_var_em1_power') | float(0) | round(0) | int }} W

  # Voz y luces sin bloquear la automatización
  - action: script.turn_on
    target:
      entity_id: script.notificar_con_mensaje_de_voz
    data:
      variables:
        zona: "surface cocina"
        title: >-
          Advertencia. Consumo muy alto detectado.
          La potencia inicial era de {{ potencia_inicial | round(0) | int }} vatios.
          La potencia actual es de {{ potencia_final | round(0) | int }} vatios.
          {% if acciones | count > 0 %}
          Se han aplicado {{ acciones | count }} medidas de protección.
          {% else %}
          No había cargas controlables que desconectar.
          {% endif %}
          {{ estado_final_voz }}
    continue_on_error: true

  - action: script.turn_on
    target:
      entity_id: script.encender_luces_casa_parpadeantes_alertas
    data:
      variables:
        color_name: YELLOW
    continue_on_error: true