- id: '1765208241617'
  alias: >
    Aviso - Consumo en inversor muy alto (>6000W) v4

  description: |-
    Protección rápida para evitar caída del inversor.

    Consumo inversor > 6000 W

    - Si DHW apoyo >300 W → DHW a Eco   DESACTIVADO TEMP por
    - Si el apoyo eléctrico del ACS consumía >300W
    - Si lavadora >400 W → switch.lavadora OFF
    - Si lavavajillas >700 W → switch.lavavajillas OFF
    - Si no basta → detener carga del coche

  trigger:
    - platform: numeric_state
      entity_id: sensor.inversor_power
      above: 6000

  condition: []

  action:

    - variables:

        # ============================================================
        # CONFIGURACIÓN
        # ============================================================

        #umbral_dhw_w: 300
        umbral_dhw_apoyo_elec_w: 300
        umbral_lavadora_w: 400
        umbral_lavavajillas_w: 700
        umbral_coche_w: 2000

        # ============================================================
        # DATOS DEL DISPARO
        # =============
        
        potencia_inversor: >
          {{ states('sensor.inversor_power') | float(0) }}

        nombre_sensor: >
          {{ state_attr('sensor.inversor_power', 'friendly_name')
             | default('Potencia inversor') }}

        unidad_sensor: >
          {{ state_attr('sensor.inversor_power', 'unit_of_measurement')
             | default('W') }}

        # ============================================================
        # MEDIDAS REALES
        # ============================================================

        #dhw_w: >
        #  {{ states('sensor.aerotermia_apoyo_electrico_potencia') | float(0) }}

        dhw_apoyo_elec_w: >
          {{ states('sensor.m_aerotermia_apoyo_electrico_potencia') | float(0) }}

        lavadora_w: >
          {{ states('sensor.lavadora_consumo_actual') | float(0) }}

        lavavajillas_w: >
          {{ states('sensor.lavavajillas_consumo_actual') | float(0) }}

        coche_w: >
          {{ states('sensor.m_ext_coche_potencia') | float(0) }}

        coche_charge_api: >
          {{ iif(is_state('binary_sensor.ioniq_ev_battery_charge','on'),'Cargando','No cargando') }}

        # ============================================================
        # DECISIONES
        
        # ============================================================

        # DHW (DESHABILITADO TEMPORALMENTE)
        #
        # Versión anterior:
        #   Si el apoyo eléctrico del ACS consumía >300W
        #   se cambiaba el modo DHW a Eco.
        #
        # Se mantiene comentado por si en el futuro se vuelve
        # a utilizar junto con la desconexión de resistencias.
        # ============================================================
        #cortar_dhw: >
        #  {{
        #    dhw_w > umbral_dhw_w
        #    and state_attr(
        #      'water_heater.instalaciones_dhw',
        #      'operation_mode'
        #    ) != 'Eco'
        #  }}

        cortar_dhw_apoyo_elec: >
          {{
            dhw_apoyo_elec_w > umbral_dhw_apoyo_elec_w
            and is_state('switch.aerotermia_apoyo_electrico','on')
          }}

        cortar_lavadora: >
          {{
            lavadora_w > umbral_lavadora_w
            and is_state('switch.lavadora','on')
          }}

        cortar_lavavajillas: >
          {{
            lavavajillas_w > umbral_lavavajillas_w
            and is_state('switch.lavavajillas','on')
          }}

        #cortar_coche: >
        #  {{
        #    coche_w > umbral_coche_w
        #    and not cortar_dhw
        #    and not cortar_lavadora
        #    and not cortar_lavavajillas
        #  }}

        cortar_coche: >
          {{
            coche_w > umbral_coche_w
            and not cortar_dhw_apoyo_elec
            and not cortar_lavadora
            and not cortar_lavavajillas
          }}

        # ============================================================
        # ESTIMACIÓN DE POTENCIA LIBERADA
        # ============================================================

        #potencia_liberada: >
        #  {{
        #    (dhw_w if cortar_dhw else 0)
        #    +
        #    (lavadora_w if cortar_lavadora else 0)
        #    +
        #    (lavavajillas_w if cortar_lavavajillas else 0)
        #    +
        #    (coche_w if cortar_coche else 0)
        #  }}
        potencia_liberada: >
          {{
            (dhw_apoyo_elec_w if cortar_dhw_apoyo_elec else 0)
            +
            (lavadora_w if cortar_lavadora else 0)
            +
            (lavavajillas_w if cortar_lavavajillas else 0)
            +
            (coche_w if cortar_coche else 0)
          }}

        # METER EN acciones_realizadas
        #  {% if cortar_dhw %}
        #    {% set ns.txt = ns.txt + ['♨️ DHW → ECO (' ~ (dhw_w|round(0)) ~ 'W)'] %}
        #  {% endif %}
        acciones_realizadas: >

          {% set ns = namespace(txt=[]) %}

          {% if cortar_dhw_apoyo_elec %}
            {% set ns.txt = ns.txt + ['🔥 Resistencia apoyo → OFF (' ~ (dhw_apoyo_elec_w|round(0)) ~ 'W)'] %}
          {% endif %}

          {% if cortar_lavadora %}
            {% set ns.txt = ns.txt + ['👕 Lavadora → OFF (' ~ (lavadora_w|round(0)) ~ 'W)'] %}
          {% endif %}

          {% if cortar_lavavajillas %}
            {% set ns.txt = ns.txt + ['🍽️ Lavavajillas → OFF (' ~ (lavavajillas_w|round(0)) ~ 'W)'] %}
          {% endif %}

          {% if cortar_coche %}
            {% set ns.txt = ns.txt + ['🚗 Carga coche → STOP (' ~ (coche_w|round(0)) ~ 'W)'] %}
          {% endif %}

          {% if ns.txt | count == 0 %}
            Sin cargas controlables disponibles.
          {% else %}
            {{ ns.txt | join('\n') }}
          {% endif %}

    - service: siren.turn_on
      target:
        entity_id: siren.yelmo
      data:
        volume_level: 0.25
        duration: 7
        tone: Alarm 5

    # ============================================================
    # DHW
    # ============================================================

    #- if:
    #    - condition: template
    #      value_template: "{{ cortar_dhw }}"
    #  then:
    #    - service: water_heater.set_operation_mode
    #      target:
    #        entity_id: water_heater.instalaciones_dhw
    #      data:
    #        operation_mode: Eco
    #      continue_on_error: true

    # ============================================================
    # RESISTENCIA APOYO ACS
    # ============================================================
    
    - if:
        - condition: template
          value_template: "{{ cortar_dhw_apoyo_elec }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.aerotermia_apoyo_electrico
          continue_on_error: true

    # ============================================================
    # LAVADORA
    # ============================================================

    - if:
        - condition: template
          value_template: "{{ cortar_lavadora }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.lavadora
          continue_on_error: true

    # ============================================================
    # LAVAVAJILLAS
    # ============================================================

    - if:
        - condition: template
          value_template: "{{ cortar_lavavajillas }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: switch.lavavajillas
          continue_on_error: true

    # ============================================================
    # COCHE
    # ============================================================

    - if:
        - condition: template
          value_template: "{{ cortar_coche }}"
      then:
        - service: kia_uvo.stop_charge
          continue_on_error: true

        - action: button.press
          target:
            entity_id: button.ioniq_force_refresh
          continue_on_error: true

    # ============================================================
    # NOTIFICACIÓN
    # ============================================================
    - service: persistent_notification.create
      data:
        notification_id: Consumo_alto_casa
        title: "⚠️ Consumo muy alto detectado v4"
        message: >-

          🕒 {{ now().strftime('%H:%M:%S') }}

          ⚡ {{ nombre_sensor }}
          alcanzó {{ potencia_inversor|round(0) }}{{ unidad_sensor }}

          ------------------------------------------------

          🛡️ Acciones ejecutadas:

          {{ acciones_realizadas }}

          ------------------------------------------------

          📉 Potencia liberada estimada:
          {{ potencia_liberada|round(0) }}W

          ------------------------------------------------

          🚗 Coche:
          {{ coche_w|round(0) }}W
          (API Hyundai: {{ coche_charge_api }})

          ♨️ DHW:
          {{ dhw_apoyo_elec_w|round(0) }}W

          👕 Lavadora:
          {{ lavadora_w|round(0) }}W

          🍽️ Lavavajillas:
          {{ lavavajillas_w|round(0) }}W

          ------------------------------------------------

          🍳 Vitro:
          {{ states('sensor.m_var_em2_power') }}W

          🍕 Horno:
          {{ states('sensor.m_var_em0_power') }}W

          ♨️❄️ Aerotermia:
          {{ states('sensor.baxi_total_potencia') }}W

          🍴 Aux cocina:
          {{ states('sensor.m_aux_phase_a_active_power') }}W

          🛋️ Aux habitaciones:
          {{ states('sensor.m_aux_phase_b_active_power') }}W

          💻 Aux IT:
          {{ states('sensor.m_aux_phase_c_active_power') }}W

          💡 Luces:
          {{ states('sensor.m_var_em1_power') }}W

    - service: script.notificar_con_mensaje_de_voz
      data:
        title: >
          Advertencia.
          Consumo muy alto detectado.
          Potencia actual {{ potencia_inversor|round(0) }} vatios.
          Se han aplicado medidas automáticas de protección.
          Potencia liberada estimada:
          {{ potencia_liberada|round(0) }}W

          Acciones ejecutadas:
          {{ acciones_realizadas }}
        zona: surface cocina

    - service: script.encender_luces_casa_parpadeantes_alertas
      data:
        color_name: YELLOW

  mode: single
