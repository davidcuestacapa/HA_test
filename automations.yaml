- id: '1758320505378'
  alias: Encender lamparita entrada por movimiento (solo noche)
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.movimiento_pasillo_movimiento
    - binary_sensor.movimiento_entrada_movimiento
    to:
    - 'on'
    from:
    - 'off'
  - trigger: state
    entity_id:
    - binary_sensor.test_prestemp_ext_este_presence
    from:
    - 'off'
    to:
    - 'on'
  - trigger: state
    entity_id:
    - binary_sensor.presencia2_salon_presence
    to:
    - 'on'
    from:
    - 'off'
  - trigger: state
    entity_id:
    - binary_sensor.sensor_puerta_ppal_window
    to:
    - 'on'
  conditions:
  - condition: or
    conditions:
    - type: is_illuminance
      condition: device
      device_id: 4168f096afbb050d0e3be5f14bd96a73
      entity_id: df5791a91bccce74a441d3aa9a96f5f8
      domain: sensor
      below: 20
    - type: is_illuminance
      condition: device
      device_id: bed5bad7b1a6e088fc87b27629b62298
      entity_id: a26add298d0832800b364511100c0a2f
      domain: sensor
      below: 20
  actions:
  - alias: Turn on the light
    action: light.turn_on
    target:
      device_id: 1e14f83c3c9302f1ad4225a4a01e3c1b
    data:
      color_temp_kelvin: 2000
      brightness_pct: 1
  - alias: espera fin movimiento
    wait_for_trigger:
    - trigger: state
      entity_id:
      - binary_sensor.movimiento_pasillo_movimiento
      - binary_sensor.movimiento_entrada_movimiento
      - binary_sensor.presencia2_salon_presence
      - binary_sensor.test_prestemp_ext_este_presence
      from:
      - 'on'
      to:
      - 'off'
  - alias: Y espera otro min
    delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - alias: Turn off the light
    action: light.turn_off
    target:
      device_id: 1e14f83c3c9302f1ad4225a4a01e3c1b
    data: {}
  mode: restart
  max_exceeded: silent
