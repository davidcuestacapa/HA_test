- id: '1758548758093'
  alias: Familia en casa Desactivada y Limpieza Programada
  description: Desactiva Familia en casa al no detectar movimiento (y desact privacidad
    cámaras) y arranca aspirador si es L-M-V o >47h desde última limpieza
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.presencia_agrupada_activa
    to: 'off'
    for:
      hours: 2
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.familia_en_casa
  - action: notify.persistent_notification
    data:
      title: "⚠️HA-Seguridad -\U0001F3E0\U0001F3DA️Cerce sin movimiento"
      message: Desactivado Familia en casa y activadas cámaras
  - action: script.notificar_a_administradores
    data:
      title: "⚠️HA-Seguridad -\U0001F3E0\U0001F3DA️Cerce sin movimiento"
      message: "\U0001F552{{ now().strftime('%H:%M') }} \U0001F6AAPuerta {{ states('binary_sensor.sensor_puerta_ppal_window')
        }}"
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: template
          value_template: "{% set ultima_limpieza = states('sensor.dreamebot_d9_max_white_cleaning_history')
            %} {% if is_state('sensor.dreamebot_d9_max_white_cleaning_history', 'unknown')
            or \n      is_state('sensor.dreamebot_d9_max_white_cleaning_history',
            'unavailable') %}\n  true\n{% else %}\n  {{ (as_timestamp(now()) - as_timestamp(ultima_limpieza))
            > (72 * 3600) }}\n{% endif %}\n"
        - condition: and
          conditions:
          - condition: time
            weekday:
            - mon
            - wed
            - fri
            after: 08:00:00
            before: '20:00:00'
          - condition: template
            value_template: "{% set ultima_limpieza = states('sensor.dreamebot_d9_max_white_cleaning_history')
              %} {% if is_state('sensor.dreamebot_d9_max_white_cleaning_history',
              'unknown') or \n      is_state('sensor.dreamebot_d9_max_white_cleaning_history',
              'unavailable') %}\n  true\n{% else %}\n  {{ (as_timestamp(now()) - as_timestamp(ultima_limpieza))
              > (47 * 3600) }}\n{% endif %}\n"
      sequence:
      - action: vacuum.start
        target:
          device_id: d5e1741fefd51fe965bce588b26d537d
        data: {}
  mode: single
- id: '1759337640890'
  alias: Mando Dani - Luz y Color, persiana y Dani dormir
  description: ''
  triggers:
  - device_id: 3f51faccdd9c34964e91a8cb224cb587
    domain: bthome
    type: button_1
    subtype: press
    id: b1_press
    trigger: device
  - device_id: 3f51faccdd9c34964e91a8cb224cb587
    domain: bthome
    type: button_1
    subtype: long_press
    trigger: device
    id: b1_long
  - device_id: 3f51faccdd9c34964e91a8cb224cb587
    domain: bthome
    type: button_1
    subtype: double_press
    id: b1_double
    trigger: device
  - device_id: 3f51faccdd9c34964e91a8cb224cb587
    domain: bthome
    type: button_2
    subtype: press
    trigger: device
    id: b2_press
  - device_id: 3f51faccdd9c34964e91a8cb224cb587
    domain: bthome
    type: button_3
    subtype: press
    trigger: device
    id: b3_press
  - device_id: 3f51faccdd9c34964e91a8cb224cb587
    domain: bthome
    type: button_4
    subtype: press
    trigger: device
    id: b4_press
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - b1_press
      sequence:
      - alias: Encender o apagar luz Dani
        target:
          entity_id: light.luz_dani
        action: light.toggle
        data: {}
    - conditions:
      - condition: trigger
        id:
        - b1_long
      sequence:
      - alias: Avanzar color en input_select
        target:
          entity_id: input_select.color_luz_dani
        data:
          cycle: true
        action: input_select.select_next
      - alias: Aplicar color a luz Dani
        choose:
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.color_luz_dani'') == ''Blanco
              frío'' }}'
          sequence:
          - target:
              entity_id: light.luz_dani
            data:
              color_temp_kelvin: 6500
              brightness: 255
            action: light.turn_on
        default:
        - target:
            entity_id: light.luz_dani
          data:
            rgb_color: "{% set color = states('input_select.color_luz_dani') %} {%
              if color == 'Rojo' %}\n  [255, 0, 0]\n{% elif color == 'Azul' %}\n  [0,
              0, 255]\n{% elif color == 'Verde' %}\n  [0, 255, 0]\n{% elif color ==
              'Amarillo' %}\n  [255, 255, 0]\n{% else %}\n  [255, 200, 255]\n{% endif
              %}\n"
            brightness: 255
          action: light.turn_on
    - conditions:
      - condition: trigger
        id:
        - b1_double
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.luz_dani
        data:
          color_temp_kelvin: 6500
          brightness_pct: 100
    - conditions:
      - condition: trigger
        id:
        - b2_press
      sequence:
      - variables:
          estado: '{{ states(''cover.persiana_dani_cover_0'') }}'
          pos: '{{ state_attr(''cover.persiana_dani_cover_0'',''current_position'')
            | int }}'
          ultima: '{{ states(''input_select.persiana_dani_ultima_direccion'') }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ estado in [''opening'',''closing''] }}

              '
          sequence:
          - action: cover.stop_cover
            target:
              entity_id: cover.persiana_dani_cover_0
        - conditions:
          - condition: template
            value_template: '{{ estado in [''open'',''closed'',''stopped''] }}

              '
          sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.persiana_dani_cover_0
    - conditions:
      - condition: trigger
        id:
        - b3_press
      sequence:
      - variables:
          estado: '{{ states(''cover.persiana_dani_cover_0'') }}'
          pos: '{{ state_attr(''cover.persiana_dani_cover_0'',''current_position'')
            | int }}'
          ultima: '{{ states(''input_select.persiana_dani_ultima_direccion'') }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ estado in [''opening'',''closing''] }}

              '
          sequence:
          - action: cover.stop_cover
            target:
              entity_id: cover.persiana_dani_cover_0
        - conditions:
          - condition: template
            value_template: '{{ estado in [''open'',''closed'',''stopped''] }}

              '
          sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.persiana_dani_cover_0
    - conditions:
      - condition: trigger
        id:
        - b4_press
      sequence:
      - action: input_boolean.toggle
        metadata: {}
        target:
          entity_id: input_boolean.dani_dormir
        data: {}
  mode: single
