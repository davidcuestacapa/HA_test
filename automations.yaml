- id: '1759517418429'
  alias: Persianas sol Subir Despacho y Dani cuando amanece según azimut y pocas nubes
  description: 'Azimut: El 11Dic desde 155º (Ago) se baja a 115º por sol detras de
    casa Ruben. Vigilar durante año azimut borde casa.'
  triggers:
  - entity_id:
    - sun.sun
    trigger: state
    to: above_horizon
  conditions:
  - condition: numeric_state
    entity_id: weather.forecast_casa
    attribute: cloud_coverage
    below: 30
  - condition: numeric_state
    entity_id: sun.sun
    attribute: azimuth
    above: 0
    below: 115
  - condition: state
    entity_id: input_select.ems_modo_climatizacion
    state:
    - Auto
  actions:
  - target:
      entity_id: cover.persiana_despacho_dcha_cover_0
    action: cover.open_cover
    data: {}
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.sun_solar_azimuth
        below: 70
      sequence:
      - device_id: a643ee1e17df68368f582e5870d28402
        domain: cover
        entity_id: ce0673a2aeea65411ddfb6614a03e632
        type: open
  mode: single
- id: '1759520724519'
  alias: Persianas sol Subir laterales si el sol está alto y pocas nubes
  description: ''
  triggers:
  - entity_id:
    - sensor.sun_solar_elevation
    above: 16
    trigger: numeric_state
  - trigger: numeric_state
    entity_id:
    - sensor.sun_solar_azimuth
    above: 140
  - trigger: numeric_state
    entity_id:
    - sensor.presencia_ext_este_illuminance
    above: 2900
  conditions: []
  actions:
  - repeat:
      while:
      - condition: numeric_state
        entity_id: sensor.sun_solar_azimuth
        below: 160
      sequence:
      - alias: Verifica si sol directo >2900lx, ejecuta subir persiana y espera >160
        choose:
        - conditions:
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.presencia_ext_este_illuminance
              above: 2900
          sequence:
          - target:
              entity_id: scene.persianas_laterales_abrir_cuando_hay_sol
            action: scene.turn_on
            data: {}
          - wait_for_trigger:
            - trigger: numeric_state
              entity_id:
              - sensor.sun_solar_azimuth
              above: 160
      - wait_for_trigger:
        - trigger: numeric_state
          entity_id:
          - sensor.presencia_ext_este_illuminance
          for:
            hours: 0
            minutes: 3
            seconds: 0
          above: 2900
        - trigger: numeric_state
          entity_id:
          - sensor.sun_solar_azimuth
          above: 160
        alias: Sino, espera 2 disparadores
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.familia_en_casa
        state:
        - 'on'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.segun_sol_persianas_laterales_cerrar_parcial_todas
