encender_luces_casa_parpadeantes_alertas:
  alias: Alerta - Encender luz casa parpadeante y Script activar camaras Tapo
  description: ''
  mode: restart
  fields:
    color_name:
      selector:
        select:
          options:
          - GREEN
          - YELLOW
          - BLUE
          - RED
      default: WHITE
      name: Colorines
  sequence:
  - action: light.turn_on
    target:
      entity_id:
      - light.hue_tento_color_panel_1
      - light.hue_tento_color_panel_2
      - light.luz_dani
      - light.lamparita_entrada
      - light.lampara_salon
    data:
      brightness: 255
      color_name: '{{ color_name }}'
  - action: script.camra_tapo_activar_sirena
    data: {}
  - repeat:
      count: 20
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.hue_tento_color_panel_1
          - light.hue_tento_color_panel_2
          - light.luz_dani
          - light.lamparita_entrada
          - light.lampara_salon
        data:
          brightness: 255
          color_name: '{{ color_name }}'
      - delay:
          seconds: 1
      - action: light.turn_off
        target:
          entity_id:
          - light.hue_tento_color_panel_1
          - light.hue_tento_color_panel_2
          - light.luz_dani
          - light.lamparita_entrada
          - light.lampara_salon
      - delay:
          seconds: 1
  - action: light.turn_on
    target:
      entity_id:
      - light.lamparita_entrada
      - light.lampara_salon
    data:
      brightness: 255
      color_name: '{{ color_name }}'
notificar_a_administradores:
  sequence:
  - data:
      title: '{{ title }}'
      message: "{{ message }} \U0001F50BBateria {{ states('sensor.inversor_battery')
        }}% ⚡Consumo {{   states('sensor.inversor_power') }}W ⚡Produciendo {{ states('sensor.inversor_pv_power')
        }}W. Estim.  {{\n  states('sensor.power_production_now') }}W. \n  \U0001F4C8Est.
        hora {{ states('sensor.energy_current_hour') }}Kwh. Prox. hora {{\n  states('sensor.energy_next_hour')
        }}Kwh  \n  \U0001F4C5Producido real {{  states('sensor.inversor_today_production')
        }}Kwh + Resto estimado hoy {{  states('sensor.energy_production_today_remaining')
        }}Kwh =?\n  Est. hoy {{  states('sensor.energy_production_today') }}Kwh\n
        \ \U0001F4C5Estimado mañana {{  states('sensor.energy_production_tomorrow')
        }}Kwh\n  \U0001F321️Temp. casa {{  state_attr('climate.zona1','current_temperature')
        }}°C  (Ext.  {{  states('sensor.cerce_outdoor_temperature') }}°C) ☁️Nubes
        {{  state_attr('weather.forecast_casa','cloud_coverage') }}%  \n  \U0001F321️Termostato
        a {{ state_attr('climate.zona1','temperature') }}°C. (Modo {{\n  states('binary_sensor.zona1_status')
        }}, Zona1:{{  states('climate.zona1') }},\n  Preset_mode:{{ state_attr('climate.zona1','preset_mode')
        }}, Hvac_action:{{\n  state_attr('climate.zona1','hvac_action') }})"
    action: notify.mobile_app_david_x
  alias: Notificar a administradores
  fields:
    title:
      description: Título de la notificación
      example: "\U0001F514 Alerta"
    message:
      description: Mensaje de la notificación
      example: Temperatura normal
    data:
      selector:
        text:
      description: imagen
  mode: parallel
  description: ''
